<div style="height:300px; width:350px; padding:1%; margin-left: 1%;background-color: rgba(0, 0, 0, 0.4);border:3px solid rgba(0, 0, 0, 0.2);display: flex;flex-direction: column;border-radius: 10px;">
    <h1 style="color: rgb(255, 255, 255);">Reset Password</h1>
    <div style="display: flex; flex-direction: column;">
        <mat-form-field appearance="fill">
            <mat-label>New Password</mat-label>
            <input matInput type="password" required style="margin-bottom: 10px;" [(ngModel)]="password">
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Confirm New Password</mat-label>
            <input matInput type="password" required style="margin-bottom: 10px;" [(ngModel)]="confirmPassword">
        </mat-form-field>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button mat-raised-button color="primary" style="width: 100%;" (click)="resetPassword()">Reset Password</button>
        </div>
    </div>
</div>
